name: Reorder monitor columns
on:
  push:
    paths:
      - .github/workflows/reorder-monitor-columns.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move schedule column before task
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index-ADMIN-v8.html')
          s = p.read_text(encoding='utf-8')
          old_head = '''                        <th>Tarefa</th>\n                        <th>Integrante</th>\n                        <th>Dia da Semana</th>\n                        <th>Início / Fim (Sugerido vs Real)</th>\n                        <th>Status</th>\n                        <th>Pontos</th>'''
          new_head = '''                        <th>Início / Fim (Sugerido vs Real)</th>\n                        <th>Tarefa</th>\n                        <th>Integrante</th>\n                        <th>Dia da Semana</th>\n                        <th>Status</th>\n                        <th>Pontos</th>'''
          old_row = '''                    <td><strong>${escaparHtml(t.nome)}</strong></td>\n                    <td>${escaparHtml(t.perfilNome)}</td>\n                    <td>${escaparHtml(t.diaSemana)}</td>\n                    <td>${horariosHtml}</td>\n                    <td><span class="badge ${badgeClass}">${escaparHtml(statusTexto)}</span></td>\n                    <td>${t.pontosGanhos || 0} / ${t.pontosMaximos} pts</td>'''
          new_row = '''                    <td>${horariosHtml}</td>\n                    <td><strong>${escaparHtml(t.nome)}</strong></td>\n                    <td>${escaparHtml(t.perfilNome)}</td>\n                    <td>${escaparHtml(t.diaSemana)}</td>\n                    <td><span class="badge ${badgeClass}">${escaparHtml(statusTexto)}</span></td>\n                    <td>${t.pontosGanhos || 0} / ${t.pontosMaximos} pts</td>'''
          if old_head not in s or old_row not in s:
              raise SystemExit('Trechos esperados não encontrados; nenhuma alteração feita.')
          s = s.replace(old_head, new_head, 1).replace(old_row, new_row, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-ADMIN-v8.html
          git diff --cached --quiet && exit 0
          git commit -m "Move schedule column before task in monitor"
          git push
