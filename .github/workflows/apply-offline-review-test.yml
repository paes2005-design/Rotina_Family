name: Apply offline review test patch
on:
  push:
    branches:
      - test/offline-review
    paths:
      - tools/apply_offline_review_patch.py
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/offline-review
      - name: Apply exact patch
        run: python tools/apply_offline_review_patch.py
      - name: Validate offline review and core regressions
        run: |
          node --check adm-justification-review.js
          node --check mobile-app-ui.js
          node --check manage-pro.js
          node --check sw.js
          node <<'NODE'
          const fs=require('fs');
          const review=fs.readFileSync('adm-justification-review.js','utf8');
          const html=fs.readFileSync('index-ADMIN-v8.html','utf8');
          const sw=fs.readFileSync('sw.js','utf8');
          const assert=(v,m)=>{if(!v)throw new Error(m);console.log('OK - '+m)};
          assert(!review.includes('runTransaction'),'offline review does not depend on transactions');
          assert(review.includes('writeBatch'),'offline review uses persisted batch writes');
          assert(review.includes('commitSemBloquearOffline'),'offline commit does not block UI');
          assert(review.includes('navigator.onLine===false'),'offline UX is explicit');
          assert(review.includes('decisaoTomada'),'single-decision/revert rule remains');
          assert(review.includes('deleteField()'),'revert clears prior review fields');
          assert(review.includes("tipo==='reverter'"),'revert flow remains');
          assert(review.includes('pontosOriginais'),'automatic original result remains preserved');
          assert(html.includes('persistentLocalCache')&&html.includes('persistentMultipleTabManager'),'persistent Firestore cache remains enabled');
          assert(sw.includes("rotina-family-adm-v26"),'ADM cache version bumped');
          assert(!review.includes('setInterval(')&&!review.includes('MutationObserver'),'review module stays timer/observer free');
          for(const f of ['salvarTarefa','atualizarMonitor','renderizarDashboard']) assert(html.includes(f),`core flow ${f} remains`);
          console.log('ALL OFFLINE REVIEW TESTS PASSED');
          NODE
      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adm-justification-review.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Support offline point review"
          git push origin test/offline-review
