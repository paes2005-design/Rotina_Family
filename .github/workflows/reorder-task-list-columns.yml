name: Reorder task list columns
on:
  push:
    paths:
      - .github/workflows/reorder-task-list-columns.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move schedule column before task
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-ADMIN-v8.html')
          s=p.read_text()
          old='''                            <th>Tarefa</th>\n                            <th>Integrante</th>\n                            <th>Horário Sugerido</th>\n                            <th>Ações</th>'''
          new='''                            <th>Horário Sugerido</th>\n                            <th>Tarefa</th>\n                            <th>Integrante</th>\n                            <th>Ações</th>'''
          assert old in s, 'Cabeçalho esperado não encontrado'
          s=s.replace(old,new,1)
          old_row='''                    <td><strong>${escaparHtml(t.nome)}</strong></td>\n                    <td>${escaparHtml(t.perfilNome)}</td>\n                    <td>${t.horaSugeridaInicio} às ${t.horaSugeridaFim}</td>\n                    <td>'''
          new_row='''                    <td>${t.horaSugeridaInicio} às ${t.horaSugeridaFim}</td>\n                    <td><strong>${escaparHtml(t.nome)}</strong></td>\n                    <td>${escaparHtml(t.perfilNome)}</td>\n                    <td>'''
          assert old_row in s, 'Linha esperada não encontrada'
          s=s.replace(old_row,new_row,1)
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-ADMIN-v8.html
          git commit -m "Move schedule column before task in cadastro"
          git pull --rebase origin main
          git push
