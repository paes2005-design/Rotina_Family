name: Apply Rotina Family ADM v9
on:
  push:
    paths:
      - .github/workflows/apply-rotina-upgrade.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and validate ADM
        shell: bash
        run: |
          cat .upgrade-v9/01.txt .upgrade-v9/02.txt .upgrade-v9/03.txt > /tmp/payload.txt
          python - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(Path('/tmp/payload.txt').read_text()))
          expected='1e4d37c54bddaf9bca2ffc749394cb96490311b74ec7cec034efa460895521af'
          got=hashlib.sha256(raw).hexdigest()
          assert got==expected,(got,expected)
          text=raw.decode('utf-8')
          assert 'Ranking Diário' in text and 'Ranking Mensal' in text
          assert 'persistentLocalCache' in text
          Path('index-ADMIN-v8.html').write_bytes(raw)
          PY
      - name: Commit ADM
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-ADMIN-v8.html
          git diff --cached --quiet && exit 0
          git commit -m "Publish ADM rankings filters and offline support"
          git push
