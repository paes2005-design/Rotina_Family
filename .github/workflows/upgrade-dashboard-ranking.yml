name: Upgrade ADM ranking dashboard
on:
  push:
    paths:
      - .github/workflows/upgrade-dashboard-ranking.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade ranking dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-ADMIN-v8.html')
          s=p.read_text()

          css_marker='''        .ranking-item, .recompensa-item, .resgate-item { background:#fff; border:1px solid var(--border-color); border-radius:10px; padding:12px; margin:8px 0; }'''
          css_new=css_marker+'''\n        .dashboard-pro { display:grid; gap:18px; }\n        .dashboard-summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }\n        .dashboard-kpi { background:linear-gradient(145deg,#fff,#f7fbff); border:1px solid #dbe7f3; border-radius:16px; padding:16px; box-shadow:0 5px 18px rgba(37,71,106,.07); }\n        .dashboard-kpi small { display:block; color:#718096; font-weight:700; text-transform:uppercase; font-size:11px; letter-spacing:.04em; margin-bottom:8px; }\n        .dashboard-kpi strong { display:block; font-size:1.55rem; color:#20364d; }\n        .dashboard-kpi em { display:block; font-style:normal; font-size:12px; color:#718096; margin-top:5px; }\n        .dashboard-grid-2 { display:grid; grid-template-columns:1.05fr .95fr; gap:16px; align-items:stretch; }\n        .dashboard-panel { background:#fff; border:1px solid #dde7f0; border-radius:18px; padding:17px; box-shadow:0 6px 20px rgba(37,71,106,.06); }\n        .dashboard-panel h3 { margin:0 0 5px; color:#263b50; }\n        .dashboard-panel .sub { color:#7a8795; font-size:12px; margin-bottom:14px; }\n        .podium { display:grid; grid-template-columns:1fr 1.15fr 1fr; gap:10px; align-items:end; min-height:205px; padding-top:12px; }\n        .podium-card { text-align:center; border-radius:16px 16px 8px 8px; padding:13px 8px; border:1px solid #e3e9ef; background:#f8fafc; position:relative; }\n        .podium-card.first { min-height:165px; background:linear-gradient(180deg,#fff7d6,#fff); border-color:#f1cf5b; }\n        .podium-card.second { min-height:135px; background:linear-gradient(180deg,#f3f6f8,#fff); }\n        .podium-card.third { min-height:115px; background:linear-gradient(180deg,#fff0e6,#fff); border-color:#dfb08d; }\n        .podium-rank { font-size:1.65rem; }\n        .podium-name { font-weight:800; color:#24384b; margin:7px 0 3px; word-break:break-word; }\n        .podium-points { color:#45647f; font-size:13px; }\n        .ranking-table-pro { width:100%; border-collapse:separate; border-spacing:0 7px; }\n        .ranking-table-pro th { background:transparent; color:#738295; padding:5px 9px; font-size:11px; text-transform:uppercase; }\n        .ranking-table-pro td { background:#f8fafc; padding:11px 9px; border:0; font-size:13px; }\n        .ranking-table-pro td:first-child { border-radius:10px 0 0 10px; font-weight:800; }\n        .ranking-table-pro td:last-child { border-radius:0 10px 10px 0; }\n        .trend-up { color:#198754; font-weight:800; } .trend-down { color:#dc3545; font-weight:800; } .trend-flat { color:#718096; font-weight:800; }\n        .chart-wrap { width:100%; overflow:hidden; }\n        .chart-wrap svg { width:100%; height:auto; display:block; }\n        .chart-legend { display:flex; flex-wrap:wrap; gap:11px; font-size:11px; color:#667788; margin-top:8px; }\n        .chart-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; }\n        .period-tabs { display:flex; gap:7px; flex-wrap:wrap; margin:10px 0 0; }\n        .period-tab { border:1px solid #cbd9e6; background:white; color:#45647f; padding:7px 12px; border-radius:999px; cursor:pointer; font-weight:700; font-size:12px; }\n        .period-tab.active { background:#25476a; color:white; border-color:#25476a; }\n        @media (max-width: 780px) { .dashboard-summary{grid-template-columns:1fr 1fr}.dashboard-grid-2{grid-template-columns:1fr}.podium{gap:6px}.ranking-table-pro{min-width:610px} }\n        @media (max-width: 480px) { .dashboard-summary{grid-template-columns:1fr 1fr}.dashboard-kpi{padding:12px}.dashboard-kpi strong{font-size:1.25rem} }'''
          assert css_marker in s
          s=s.replace(css_marker,css_new,1)

          old_html='''        <div id="dashboard" class="tab-content">\n            <h2>Dashboard Familiar</h2>\n            <p style="color:#666">Visão consolidada da família por dia, semana e mês.</p>\n            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0">\n                <div><label for="dashboardDataRef">Data de referência</label><input type="date" id="dashboardDataRef" onchange="renderizarDashboard()"></div>\n                <div><label for="dashboardPerfil">Filtrar integrante</label><select id="dashboardPerfil" onchange="renderizarDashboard()"><option value="">Todos</option></select></div>\n            </div>\n            <div id="dashboardFamilia" class="dash-cards-admin"></div>\n            <div style="margin-top:25px"><h3>Ranking Diário</h3><div id="rankingDiario"></div></div>\n            <div style="margin-top:25px"><h3>Ranking Semanal</h3><div id="rankingFamilia"></div></div>\n            <div style="margin-top:25px"><h3>Ranking Mensal</h3><div id="rankingMensal"></div></div>\n        </div>'''
          new_html='''        <div id="dashboard" class="tab-content">\n            <div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap">\n                <div><h2 style="margin-bottom:4px">Dashboard de Desempenho</h2><p style="color:#667788;margin-top:0">Ranking, pontualidade e evolução da rotina familiar.</p></div>\n                <div class="period-tabs">\n                    <button id="dashTabDiario" class="period-tab" onclick="mudarPeriodoDashboard('diario')">Dia</button>\n                    <button id="dashTabSemanal" class="period-tab active" onclick="mudarPeriodoDashboard('semanal')">Semana</button>\n                    <button id="dashTabMensal" class="period-tab" onclick="mudarPeriodoDashboard('mensal')">Mês</button>\n                </div>\n            </div>\n            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0">\n                <div><label for="dashboardDataRef">Data de referência</label><input type="date" id="dashboardDataRef" onchange="renderizarDashboard()"></div>\n                <div><label for="dashboardPerfil">Filtrar integrante</label><select id="dashboardPerfil" onchange="renderizarDashboard()"><option value="">Todos</option></select></div>\n            </div>\n            <div class="dashboard-pro">\n                <div id="dashboardFamilia" class="dashboard-summary"></div>\n                <div class="dashboard-grid-2">\n                    <div class="dashboard-panel"><h3>🏆 Pódio do período</h3><div class="sub" id="dashboardPeriodoLegenda">Classificação pela pontuação</div><div id="podioDashboard" class="podium"></div></div>\n                    <div class="dashboard-panel"><h3>📊 Pontos por integrante</h3><div class="sub">Comparação direta no período selecionado</div><div id="graficoPontosDashboard" class="chart-wrap"></div></div>\n                </div>\n                <div class="dashboard-grid-2">\n                    <div class="dashboard-panel"><h3>✅ Cumprimento das tarefas</h3><div class="sub">No prazo, atraso parcial e tarefas zeradas</div><div id="graficoStatusDashboard" class="chart-wrap"></div></div>\n                    <div class="dashboard-panel"><h3>📈 Evolução dos últimos 7 dias</h3><div class="sub">Pontos conquistados por dia</div><div id="graficoEvolucaoDashboard" class="chart-wrap"></div></div>\n                </div>\n                <div class="dashboard-panel"><h3>Ranking detalhado</h3><div class="sub">Pontuação, pontualidade, tarefas e sequência</div><div class="tabela-scroll"><div id="rankingDetalhadoDashboard"></div></div></div>\n                <div style="display:none"><div id="rankingDiario"></div><div id="rankingFamilia"></div><div id="rankingMensal"></div></div>\n            </div>\n        </div>'''
          assert old_html in s
          s=s.replace(old_html,new_html,1)

          start=s.index('    window.renderizarDashboard = function(){')
          end=s.index('    window.salvarRecompensa=',start)
          new_js=r'''    let periodoDashboardAtual='semanal';
    window.mudarPeriodoDashboard=(periodo)=>{
        periodoDashboardAtual=periodo;
        ['Diario','Semanal','Mensal'].forEach(x=>document.getElementById('dashTab'+x)?.classList.toggle('active',x.toLowerCase()===periodo));
        renderizarDashboard();
    };
    function corGrafico(i){ return ['#315e8a','#4d8f74','#d39b3a','#9c6ade','#d1605d','#5b7c99','#7b8f47'][i%7]; }
    function svgBarras(dados,campo){
        if(!dados.length) return '<p style="color:#777">Sem dados no período.</p>';
        const max=Math.max(1,...dados.map(x=>x[campo])); const w=620,h=Math.max(190,dados.length*44+35),left=105,right=35,top=15,bw=w-left-right;
        let g=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de pontos">`;
        dados.forEach((x,i)=>{ const y=top+i*44,bar=Math.max(2,(x[campo]/max)*bw); g+=`<text x="${left-9}" y="${y+18}" text-anchor="end" font-size="12" fill="#526579">${escaparHtml((x.p.nome||'').slice(0,14))}</text><rect x="${left}" y="${y+5}" width="${bar}" height="20" rx="7" fill="${corGrafico(i)}" opacity=".9"/><text x="${Math.min(w-28,left+bar+7)}" y="${y+19}" font-size="11" font-weight="700" fill="#34495e">${x[campo]} pts</text>`; });
        return g+'</svg>';
    }
    function svgStatus(cont){
        const total=Math.max(1,cont.prazo100+cont.parcial+cont.zerado); const vals=[cont.prazo100,cont.parcial,cont.zerado], cores=['#4d8f74','#d39b3a','#d1605d'], labs=['No prazo','Atraso parcial','Zeradas']; let x=28;
        let s='<svg viewBox="0 0 620 210" role="img" aria-label="Gráfico de status"><rect x="28" y="45" width="564" height="34" rx="12" fill="#edf1f5"/>';
        vals.forEach((v,i)=>{ const ww=(v/total)*564; if(ww>0){s+=`<rect x="${x}" y="45" width="${ww}" height="34" rx="${i===0?12:0}" fill="${cores[i]}"/>`;x+=ww;} });
        vals.forEach((v,i)=>{ s+=`<circle cx="${65+i*185}" cy="135" r="6" fill="${cores[i]}"/><text x="${78+i*185}" y="140" font-size="12" fill="#53677b">${labs[i]}: ${v}</text><text x="${65+i*185}" y="168" font-size="18" font-weight="700" fill="#2f4358">${Math.round(v/total*100)}%</text>`; });
        return s+'</svg>';
    }
    function svgLinha(pontos){
        const w=620,h=230,l=42,r=22,t=24,b=42,max=Math.max(1,...pontos.map(x=>x.valor)),pw=w-l-r,ph=h-t-b;
        const coords=pontos.map((x,i)=>({x:l+(i*(pw/Math.max(1,pontos.length-1))),y:t+ph-(x.valor/max)*ph,...x}));
        let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolução de pontos"><line x1="${l}" y1="${t+ph}" x2="${w-r}" y2="${t+ph}" stroke="#dbe4ec"/>`;
        [0,.5,1].forEach(k=>{const yy=t+ph-(k*ph);s+=`<line x1="${l}" y1="${yy}" x2="${w-r}" y2="${yy}" stroke="#edf1f5"/><text x="${l-7}" y="${yy+4}" text-anchor="end" font-size="10" fill="#8795a4">${Math.round(max*k)}</text>`});
        if(coords.length){ s+=`<polyline fill="none" stroke="#315e8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${coords.map(c=>c.x+','+c.y).join(' ')}"/>`; coords.forEach(c=>{s+=`<circle cx="${c.x}" cy="${c.y}" r="5" fill="#fff" stroke="#315e8a" stroke-width="3"/><text x="${c.x}" y="${h-14}" text-anchor="middle" font-size="10" fill="#67798c">${c.label}</text>`}); }
        return s+'</svg>';
    }
    window.renderizarDashboard = function(){
        const box=document.getElementById('dashboardFamilia'), semanal=document.getElementById('rankingFamilia'), diario=document.getElementById('rankingDiario'), mensal=document.getElementById('rankingMensal');
        if(!box||!semanal||!diario||!mensal) return;
        const dataEl=document.getElementById('dashboardDataRef'); if(dataEl&&!dataEl.value)dataEl.value=formatarDataISO(new Date());
        const ref=new Date((dataEl?.value||formatarDataISO(new Date()))+'T12:00:00'),diaISO=formatarDataISO(ref),iniSem=formatarDataISO(obterInicioSemana(ref));
        const fimSemD=new Date(obterInicioSemana(ref)); fimSemD.setDate(fimSemD.getDate()+6); const fimSem=formatarDataISO(fimSemD),iniMes=`${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}-01`,fimMes=formatarDataISO(new Date(ref.getFullYear(),ref.getMonth()+1,0));
        const filtro=document.getElementById('dashboardPerfil'); if(filtro){const atual=filtro.value;filtro.innerHTML='<option value="">Todos</option>'+perfisCache.map(p=>`<option value="${escaparHtml(p.id)}">${escaparHtml(p.nome)}</option>`).join('');filtro.value=atual;}
        const perfis=perfisCache.filter(p=>!filtro?.value||p.id===filtro.value);
        const dados=perfis.map(p=>{const hist=historicoGrupoCache.filter(h=>(h.perfilId===p.id||(!h.perfilId&&h.perfilNome===p.nome)));const soma=(ini,fim)=>hist.filter(h=>h.data>=ini&&h.data<=fim).reduce((s,h)=>s+(Number(h.pontosGanhos)||0),0);const hs=hist.filter(h=>h.data>=iniSem&&h.data<=fimSem);const prazo100=hs.filter(h=>h.status?.includes('Prazo')&&Number(h.percentualAplicado??100)>=100).length;const parcial=hs.filter(h=>h.status?.includes('Prazo')&&Number(h.percentualAplicado??100)<100).length;const zerado=hs.filter(h=>h.status?.includes('Atrasado')||Number(h.percentualAplicado)===0).length;return{p,hist,diario:soma(diaISO,diaISO),semanal:soma(iniSem,fimSem),mensal:soma(iniMes,fimMes),concluidas:hs.length,prazo:hs.filter(h=>h.status?.includes('Prazo')).length,prazo100,parcial,zerado,seq:calcularSequencia(p)};});
        const campo=periodoDashboardAtual,ord=[...dados].sort((a,b)=>b[campo]-a[campo]);
        const todosHist=dados.flatMap(x=>x.hist); const periodoIni=campo==='diario'?diaISO:campo==='mensal'?iniMes:iniSem,periodoFim=campo==='diario'?diaISO:campo==='mensal'?fimMes:fimSem;
        const histPeriodo=todosHist.filter(h=>h.data>=periodoIni&&h.data<=periodoFim),totalPts=ord.reduce((s,x)=>s+x[campo],0),concl=histPeriodo.length,prazo=histPeriodo.filter(h=>h.status?.includes('Prazo')).length,taxa=concl?Math.round(prazo/concl*100):0,leader=ord[0];
        box.innerHTML=`<div class="dashboard-kpi"><small>🏆 Líder</small><strong>${leader?escaparHtml(leader.p.nome):'—'}</strong><em>${leader?leader[campo]+' pontos':'Sem dados'}</em></div><div class="dashboard-kpi"><small>⭐ Pontos do período</small><strong>${totalPts}</strong><em>Somatório da seleção</em></div><div class="dashboard-kpi"><small>✅ Pontualidade</small><strong>${taxa}%</strong><em>${prazo} de ${concl} concluídas</em></div><div class="dashboard-kpi"><small>🔥 Maior sequência</small><strong>${ord.length?Math.max(...ord.map(x=>x.seq)):0} dias</strong><em>Sequência atual</em></div>`;
        const pod=document.getElementById('podioDashboard'); const top=ord.slice(0,3),slots=[top[1],top[0],top[2]],classes=['second','first','third'],med=['🥈','🥇','🥉']; pod.innerHTML=slots.map((x,i)=>x?`<div class="podium-card ${classes[i]}"><div class="podium-rank">${med[i]}</div><div class="podium-name">${escaparHtml(x.p.nome)}</div><div class="podium-points">${x[campo]} pontos<br>🔥 ${x.seq} dias</div></div>`:'<div></div>').join('');
        document.getElementById('dashboardPeriodoLegenda').innerText=campo==='diario'?'Ranking do dia selecionado':campo==='mensal'?'Ranking do mês selecionado':'Ranking da semana selecionada';
        document.getElementById('graficoPontosDashboard').innerHTML=svgBarras(ord,campo);
        const cont={prazo100:histPeriodo.filter(h=>h.status?.includes('Prazo')&&Number(h.percentualAplicado??100)>=100).length,parcial:histPeriodo.filter(h=>h.status?.includes('Prazo')&&Number(h.percentualAplicado??100)<100).length,zerado:histPeriodo.filter(h=>h.status?.includes('Atrasado')||Number(h.percentualAplicado)===0).length}; document.getElementById('graficoStatusDashboard').innerHTML=svgStatus(cont);
        const evol=[];for(let i=6;i>=0;i--){const d=new Date(ref);d.setDate(d.getDate()-i);const iso=formatarDataISO(d);evol.push({label:d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''),valor:todosHist.filter(h=>h.data===iso).reduce((s,h)=>s+(Number(h.pontosGanhos)||0),0)});} document.getElementById('graficoEvolucaoDashboard').innerHTML=svgLinha(evol);
        document.getElementById('rankingDetalhadoDashboard').innerHTML=ord.length?`<table class="ranking-table-pro"><thead><tr><th>#</th><th>Integrante</th><th>Pontos</th><th>Pontualidade</th><th>Concluídas</th><th>Sequência</th></tr></thead><tbody>${ord.map((x,i)=>{const taxaX=x.concluidas?Math.round(x.prazo/x.concluidas*100):0;return`<tr><td>${i+1}º</td><td><strong>${escaparHtml(x.p.nome)}</strong></td><td>${x[campo]}</td><td>${taxaX}%</td><td>${x.concluidas}</td><td>🔥 ${x.seq}</td></tr>`}).join('')}</tbody></table>`:'<p>Sem dados no período.</p>';
        const render=(c,el)=>{const o=[...dados].sort((x,y)=>y[c]-x[c]);el.innerHTML=o.map((x,i)=>`<div class="ranking-item"><strong>${i+1}º ${escaparHtml(x.p.nome)}</strong> — ${x[c]} pts</div>`).join('')||'<p>Sem dados.</p>';};render('diario',diario);render('semanal',semanal);render('mensal',mensal);
    }
'''
          s=s[:start]+new_js+s[end:]
          p.write_text(s)
          PY
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index-ADMIN-v8.html','utf8');
          for(const m of s.matchAll(/<script(?: type="module")?>([\s\S]*?)<\/script>/g)){new Function(m[1].replace(/^\s*import .*$/mg,''));}
          console.log('JS syntax OK');
          NODE
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-ADMIN-v8.html
          git commit -m "Redesign ADM ranking dashboard"
          git pull --rebase origin main
          git push