name: Lock final delay at zero
on:
  push:
    paths:
      - .github/workflows/lock-final-delay-zero.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock zero band
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-ADMIN-v8.html'); s=p.read_text()
          s=s.replace('''    <div class="form-group"><label>Estourou o limite final (%)</label><input id="regraPct0" type="number" min="0" max="100" value="0"></div>''','''    <div class="form-group"><label>Estourou o limite final</label><div style="padding:10px;border:1px solid #ddd;border-radius:6px;background:#f8fafc"><strong>0% fixo</strong> — iniciar ou terminar depois do limite final sempre zera a pontuação.</div><input id="regraPct0" type="hidden" value="0"></div>''',1)
          s=s.replace("estourado:n(r.estourado,0)","estourado:0",1)
          s=s.replace("estourado:Number(document.getElementById('regraPct0')?.value ?? regraAtrasoAtual.estourado)","estourado:0",1)
          s=s.replace("const nova={dentroLimites:Number(document.getElementById('regraPct100').value),atrasoLeve:Number(document.getElementById('regraPct75').value),atrasoMaior:Number(document.getElementById('regraPct50').value),estourado:Number(document.getElementById('regraPct0').value)};","const nova={dentroLimites:Number(document.getElementById('regraPct100').value),atrasoLeve:Number(document.getElementById('regraPct75').value),atrasoMaior:Number(document.getElementById('regraPct50').value),estourado:0};",1)
          s=s.replace("if(['regraPct100','regraPct75','regraPct50','regraPct0'].includes(e.target?.id))","if(['regraPct100','regraPct75','regraPct50'].includes(e.target?.id))",1)
          p.write_text(s)
          PY
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('index-ADMIN-v8.html','utf8'); for(const m of s.matchAll(/<script(?: type="module")?>([\s\S]*?)<\/script>/g)){new Function(m[1].replace(/^\s*import .*$/mg,''));}
          NODE
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-ADMIN-v8.html
          git commit -m "Keep final delay penalty fixed at zero"
          git pull --rebase origin main
          git push
