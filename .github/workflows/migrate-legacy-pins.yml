name: Migrate legacy PINs
on:
  push:
    paths:
      - .github/workflows/migrate-legacy-pins.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add automatic legacy PIN migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-ADMIN-v8.html')
          s=p.read_text()
          old="""            perfisCache = snapshot.docs.map(d => ({ id: d.id, perfilId: d.data().perfilId || d.id, ...d.data() }));\n            atualizarSelects();\n            migrarTarefasLegadas().catch(console.error);"""
          new="""            perfisCache = snapshot.docs.map(d => ({ id: d.id, perfilId: d.data().perfilId || d.id, ...d.data() }));\n            for (const perfil of perfisCache) {\n                if (perfil.pin && !perfil.pinHash) {\n                    const pinHash = await hashPin(String(perfil.pin));\n                    updateDoc(doc(db,'perfis',perfil.id),{pinHash,pinVersion:2,pin:deleteField(),pinMigradoEm:new Date().toISOString()}).catch(console.error);\n                }\n            }\n            atualizarSelects();\n            migrarTarefasLegadas().catch(console.error);"""
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-ADMIN-v8.html
          git commit -m "Automatically migrate legacy profile PINs"
          git pull --rebase origin main
          git push
