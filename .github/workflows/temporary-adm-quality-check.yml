name: Rotina Family ADM regression audit
on:
  push:
    paths:
      - '.github/workflows/temporary-adm-quality-check.yml'
      - '*.js'
      - '*.css'
      - '*.html'
      - 'manifest.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and JSON
        run: |
          node --check dashboard-ranking-pro.js
          node --check monitor-pro.js
          node --check manage-pro.js
          node --check mobile-app-ui.js
          node --check adm-justification-review.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest OK')"
      - name: Full ADM regression audit
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const read=f=>fs.readFileSync(f,'utf8');
          const html=read('index-ADMIN-v8.html'),dash=read('dashboard-ranking-pro.js'),mon=read('monitor-pro.js'),manage=read('manage-pro.js'),mobile=read('mobile-app-ui.js'),css=read('mobile-app-ui.css'),review=read('adm-justification-review.js'),sw=read('sw.js'),manifest=JSON.parse(read('manifest.json'));
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg);console.log('OK - '+msg)};

          // Inicialização / estabilidade
          assert(!mobile.includes('setInterval('),'mobile UI has no continuous interval');
          assert(!review.includes('setInterval('),'review module has no continuous interval');
          assert(!review.includes('MutationObserver'),'review module adds no mutation observer');
          assert(!mobile.includes("adm-enhancements.js"),'known freezing enhancement is not imported');
          assert(!sw.includes("adm-enhancements.js"),'known freezing enhancement is outside app shell');
          assert(sw.includes("cache:'no-store'"),'app code is refreshed network-first');
          assert(manifest.start_url.includes('index-ADMIN-v8.html'),'installed ADM starts directly on real page');
          assert(sw.includes('APP_MAIN_URL'),'legacy root navigation is redirected by service worker');
          assert(mobile.includes("MOBILE_QUERY.matches"),'mobile-only UI is gated by viewport');

          // Regra explicada e totalizadores coerentes
          assert(html.includes('O saldo consumido é a soma do atraso no início com o atraso no término.'),'ADM explains shared tolerance balance');
          assert(html.includes('Tolerância excedida até +25%'),'ADM 75% band label matches current rule');
          assert(html.includes('Tolerância excedida até +50%'),'ADM 50% band label matches current rule');
          assert(html.includes('Tolerância excedida acima de +50%'),'ADM 0% band label matches current rule');
          assert(!html.includes('iniciar ou terminar depois do limite final sempre zera'),'old final-limit wording is gone');
          assert(!html.includes('if(!h.status || !h.status.includes("Prazo")) return;'),'Monitor points do not discard reviewed late-task points');

          // Monitor mobile / justificativa
          assert(mobile.includes('mon-just-flag'),'justification is a dedicated clickable flag');
          assert(mobile.includes('data-date='),'flag carries exact occurrence date');
          assert(css.includes('.mon-just-flag'),'flag has touch-friendly CSS');
          assert(css.includes('white-space:normal'),'status may wrap instead of truncating');
          assert(review.includes("`${t.perfilId}_${t.id}_${data}`"),'history lookup targets exact deterministic occurrence');
          assert(review.includes("`${data}__${t.id}`"),'execution lookup targets exact date');
          assert(review.includes("x.data===data"),'legacy history fallback remains date-scoped');
          assert(review.includes("if(!rel.hist.length)throw"),'review refuses write when exact history is missing');
          assert(review.includes('pontosOriginais'),'automatic points are preserved');
          assert(review.includes('percentualOriginal'),'automatic percentage is preserved');
          assert(review.includes('pontosDevolvidos'),'returned points are separately recorded');
          assert(review.includes('revisaoDecisao'),'adult decision is separately recorded');
          assert(review.includes("resultado-mantido"),'adult may keep automatic result');
          assert(review.includes("devolucao-total"),'adult may fully return points');

          // Decisão única / reversão
          assert(review.includes('runTransaction'),'review write uses Firestore transaction');
          assert(review.includes("function decisaoTomada(h)"),'review has explicit single-decision state');
          assert(review.includes("if(decisaoTomada(atual))throw new Error('Já existe uma decisão"),'second decision is rejected inside transaction');
          assert(review.includes('data-review="reverter"'),'reviewed occurrence replaces choices with revert button');
          assert(review.includes("if(tipo==='reverter')"),'revert path exists');
          assert(review.includes("revisaoStatus:'aguardando'"),'revert returns justification to pending review');
          for(const campo of ['percentualRevisado:deleteField()','pontosDevolvidos:deleteField()','revisaoDecisao:deleteField()','revisadoEm:deleteField()']) assert(review.includes(campo),`revert clears ${campo.split(':')[0]}`);
          assert(review.includes('pontosGanhos:o.pontos'),'revert restores automatic points');
          assert(!review.includes('Math.max(o.pctAtual'),'old progressive review accumulation is removed');

          // Status: test real function, including 100% vs 0% regression
          const sm=mobile.match(/function statusCard\(txt=''\)\{[\s\S]*?\n\}/);assert(sm,'statusCard found');
          const box={fn:null};vm.createContext(box);vm.runInContext(sm[0]+';fn=statusCard;',box);
          const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          assert(eq(box.fn('No Prazo (100%)'),['ok','100% · No prazo']),'100% is not confused with 0%');
          assert(eq(box.fn('No Prazo — atraso leve (75%)'),['partial','75% · atraso leve']),'75% status fits mobile');
          assert(eq(box.fn('No Prazo — atraso maior (50%)'),['partial','50% · atraso maior']),'50% status fits mobile');
          assert(eq(box.fn('Atrasado (0%)'),['late','0% · Atrasado']),'0% status is explicit');

          // Dashboard / ranking
          assert(dash.includes('rankingDetalhadoDashboard'),'detailed ranking renderer exists');
          assert(dash.includes('pontosGanhos'),'dashboard ranks by effective points');
          assert(dash.includes("faixaAtraso==='dentro-limites'"),'punctuality remains based on automatic result');
          assert(css.includes('#rankingDetalhadoDashboard .ranking-table-pro{min-width:0'),'mobile ranking width override exists');

          // Core admin flows still present
          for(const s of ['salvarTarefa','preencherEdicaoTarefa','excluirTarefa','atualizarMonitor','renderizarDashboard','salvarRecompensa']) assert(html.includes(s),`core flow ${s} remains present`);
          assert(html.includes('justificativaObrigatoria'),'task justification setting remains present');
          assert(html.includes('onAuthStateChanged'),'session restoration remains present');
          assert(manage.includes("import('./mobile-app-ui.js')"),'manage -> mobile UI import chain intact');
          assert(dash.includes("import('./monitor-pro.js')"),'dashboard -> monitor import chain intact');
          assert(mon.includes("import('./manage-pro.js')"),'monitor -> manage import chain intact');
          assert(mobile.includes("import('./adm-justification-review.js')"),'mobile/desktop UI -> review import intact');

          // Return point calculations: one decision changes the absolute result, not a cumulative bonus
          const pts=(max,pct)=>Math.round(max*pct/100),ret=(orig,max,p)=>Math.max(orig,pts(max,p));
          assert(ret(0,20,50)===10,'0 -> 50% = 10/20');
          assert(ret(0,20,75)===15,'0 -> 75% = 15/20');
          assert(ret(0,20,100)===20,'0 -> 100% = 20/20');
          assert(ret(10,20,75)===15,'50% -> 75% = 15/20');
          assert(ret(10,20,100)===20,'50% -> 100% = 20/20');
          assert(ret(15,20,50)===15,'review never removes already-earned points');
          const original=0,max=20,primeira=ret(original,max,50),revertida=original,nova=ret(revertida,max,100);
          assert(primeira===10&&revertida===0&&nova===20,'50% -> revert -> 100% ends at 20, never 30');
          console.log('ALL ADM REGRESSION CHECKS PASSED');
          NODE
