name: Apply final ADM audit text fix
on:
  push:
    paths:
      - '.github/workflows/apply-audit-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace final legacy tolerance wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-ADMIN-v8.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="form-group"><label>Estourou o limite final</label><div style="padding:10px;border:1px solid #ddd;border-radius:6px;background:#f8fafc"><strong>0% fixo</strong> — iniciar ou terminar depois do limite final sempre zera a pontuação.</div><input id="regraPct0" type="hidden" value="0"></div>'
          new='<div class="form-group"><label>Tolerância excedida acima de +50%</label><div style="padding:10px;border:1px solid #ddd;border-radius:6px;background:#f8fafc"><strong>0% fixo</strong> — consumir mais de 50% além do saldo de tolerância zera a pontuação automática.</div><input id="regraPct0" type="hidden" value="0"></div>'
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly 1 final legacy tolerance text, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify final wording
        run: |
          grep -F 'Tolerância excedida acima de +50%' index-ADMIN-v8.html
          ! grep -F 'iniciar ou terminar depois do limite final sempre zera' index-ADMIN-v8.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-ADMIN-v8.html
          git commit -m "Fix final ADM tolerance wording"
          git push
