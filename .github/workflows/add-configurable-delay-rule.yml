name: Add configurable delay scoring rule
on:
  push:
    paths:
      - .github/workflows/add-configurable-delay-rule.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ADM delay rule configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-ADMIN-v8.html')
          s=p.read_text()

          # Add admin rule card before task management list.
          marker='''            <div style="background: #fafafa; padding: 15px; border-radius: 6px; border-left: 4px solid var(--danger);">\n                <h3>Gerenciar / Excluir Tarefas Cadastradas</h3>'''
          card='''            <div style="background:#f7fbff;padding:15px;border-radius:8px;margin-bottom:25px;border-left:4px solid #2563eb;">\n                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">\n                    <div>\n                        <h3 style="margin:0 0 5px">Regra de pontuação por atraso</h3>\n                        <p style="margin:0;color:#666;font-size:13px">A regra padrão é 100% / 75% / 50% / 0%. Você pode personalizar os percentuais da família.</p>\n                    </div>\n                    <div style="display:flex;gap:8px;flex-wrap:wrap">\n                        <button class="btn-action" style="width:auto;background:#2563eb" onclick="abrirConfiguracaoRegraAtraso()">⚙️ Mudar regra</button>\n                        <button class="btn-action" style="width:auto;background:#64748b" onclick="alternarExplicacaoRegraAtrasoAdmin()">ℹ️ Entender a regra</button>\n                    </div>\n                </div>\n                <div id="explicacaoRegraAtrasoAdmin" style="display:none;margin-top:12px;padding:12px;background:white;border:1px solid #dbeafe;border-radius:8px;color:#334155;font-size:13px"></div>\n            </div>\n\n'''
          assert marker in s
          s=s.replace(marker,card+marker,1)

          # Add modal before module script.
          script_marker='<script type="module">'
          modal='''<div id="modalRegraAtrasoAdmin" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10000;align-items:center;justify-content:center;padding:16px">\n  <div style="background:white;max-width:520px;width:100%;border-radius:16px;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.25)">\n    <h2 style="margin-top:0">Configurar regra de atraso</h2>\n    <p style="color:#666;font-size:13px">Defina a porcentagem dos pontos em cada faixa. Os valores devem ficar em ordem decrescente.</p>\n    <div class="form-group"><label>Dentro dos limites (%)</label><input id="regraPct100" type="number" min="0" max="100" value="100"></div>\n    <div class="form-group"><label>Pequeno atraso no início (%)</label><input id="regraPct75" type="number" min="0" max="100" value="75"></div>\n    <div class="form-group"><label>Atraso maior no início (%)</label><input id="regraPct50" type="number" min="0" max="100" value="50"></div>\n    <div class="form-group"><label>Estourou o limite final (%)</label><input id="regraPct0" type="number" min="0" max="100" value="0"></div>\n    <div id="previewRegraAtrasoAdmin" style="padding:10px;background:#f8fafc;border-radius:8px;font-size:13px;margin:10px 0"></div>\n    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">\n      <button class="btn-action" style="width:auto;background:#64748b" onclick="fecharConfiguracaoRegraAtraso()">Cancelar</button>\n      <button class="btn-action" style="width:auto;background:#2563eb" onclick="salvarConfiguracaoRegraAtraso()">Salvar regra</button>\n    </div>\n  </div>\n</div>\n\n'''
          assert script_marker in s
          s=s.replace(script_marker,modal+script_marker,1)

          # Add setDoc import.
          old='getDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";'
          new='getDoc, setDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";'
          assert old in s
          s=s.replace(old,new,1)

          # Add rule functions after auth declaration.
          auth_marker='''    const auth = getAuth(app);\n\n'''
          js='''    const REGRA_ATRASO_PADRAO = { dentroLimites:100, atrasoLeve:75, atrasoMaior:50, estourado:0 };\n    let regraAtrasoAtual = { ...REGRA_ATRASO_PADRAO };\n\n    function normalizarRegraAtraso(valor={}) {\n        const r = valor.regraAtraso || valor || {};\n        const n = (v,p)=>Number.isFinite(Number(v)) ? Math.max(0,Math.min(100,Number(v))) : p;\n        return {\n            dentroLimites:n(r.dentroLimites,100),\n            atrasoLeve:n(r.atrasoLeve,75),\n            atrasoMaior:n(r.atrasoMaior,50),\n            estourado:n(r.estourado,0)\n        };\n    }\n    function textoRegraAtraso(r=regraAtrasoAtual){\n        return `<strong>Regra atual: ${r.dentroLimites}% / ${r.atrasoLeve}% / ${r.atrasoMaior}% / ${r.estourado}%.</strong><br>`+\n        `• Iniciou dentro da tolerância e concluiu até o limite final: <strong>${r.dentroLimites}%</strong> dos pontos.<br>`+\n        `• Iniciou após a tolerância, mas até metade de uma tolerância extra, e concluiu até o limite final: <strong>${r.atrasoLeve}%</strong>.<br>`+\n        `• Iniciou depois dessa faixa, mas ainda antes do limite final, e concluiu dentro do limite: <strong>${r.atrasoMaior}%</strong>.<br>`+\n        `• Iniciou depois do limite final ou concluiu depois dele: <strong>${r.estourado}%</strong>.<br><small>Exemplo com tolerância de 10 min: até +10 min = primeira faixa; +11 a +15 min = segunda; depois disso até o limite final = terceira.</small>`;\n    }\n    function atualizarExplicacaoRegraAtrasoAdmin(){\n        const el=document.getElementById('explicacaoRegraAtrasoAdmin'); if(el) el.innerHTML=textoRegraAtraso();\n        const prev=document.getElementById('previewRegraAtrasoAdmin'); if(prev) prev.innerHTML=textoRegraAtraso({\n            dentroLimites:Number(document.getElementById('regraPct100')?.value ?? regraAtrasoAtual.dentroLimites),\n            atrasoLeve:Number(document.getElementById('regraPct75')?.value ?? regraAtrasoAtual.atrasoLeve),\n            atrasoMaior:Number(document.getElementById('regraPct50')?.value ?? regraAtrasoAtual.atrasoMaior),\n            estourado:Number(document.getElementById('regraPct0')?.value ?? regraAtrasoAtual.estourado)\n        });\n    }\n    async function carregarRegraAtraso(){\n        const gId=adminLogadoAtual?.codigoCliente || adminLogadoAtual?.grupoId; if(!gId) return;\n        try { const snap=await getDoc(doc(db,'configGrupos',gId)); regraAtrasoAtual=normalizarRegraAtraso(snap.exists()?snap.data():{}); }\n        catch(e){ console.error('Falha ao carregar regra de atraso',e); regraAtrasoAtual={...REGRA_ATRASO_PADRAO}; }\n        atualizarExplicacaoRegraAtrasoAdmin();\n    }\n    window.alternarExplicacaoRegraAtrasoAdmin=()=>{ const el=document.getElementById('explicacaoRegraAtrasoAdmin'); if(!el)return; el.style.display=el.style.display==='none'?'block':'none'; atualizarExplicacaoRegraAtrasoAdmin(); };\n    window.abrirConfiguracaoRegraAtraso=()=>{\n        ['100','75','50','0'].forEach((suf,i)=>{ const vals=[regraAtrasoAtual.dentroLimites,regraAtrasoAtual.atrasoLeve,regraAtrasoAtual.atrasoMaior,regraAtrasoAtual.estourado]; const el=document.getElementById('regraPct'+suf); if(el) el.value=vals[i]; });\n        atualizarExplicacaoRegraAtrasoAdmin(); document.getElementById('modalRegraAtrasoAdmin').style.display='flex';\n    };\n    window.fecharConfiguracaoRegraAtraso=()=>{ document.getElementById('modalRegraAtrasoAdmin').style.display='none'; };\n    window.salvarConfiguracaoRegraAtraso=async()=>{\n        const nova={dentroLimites:Number(document.getElementById('regraPct100').value),atrasoLeve:Number(document.getElementById('regraPct75').value),atrasoMaior:Number(document.getElementById('regraPct50').value),estourado:Number(document.getElementById('regraPct0').value)};\n        if(Object.values(nova).some(v=>!Number.isFinite(v)||v<0||v>100)) return alert('Use percentuais entre 0 e 100.');\n        if(!(nova.dentroLimites>=nova.atrasoLeve && nova.atrasoLeve>=nova.atrasoMaior && nova.atrasoMaior>=nova.estourado)) return alert('Os percentuais precisam ficar em ordem decrescente: primeira faixa ≥ segunda ≥ terceira ≥ estourado.');\n        const gId=adminLogadoAtual?.codigoCliente || adminLogadoAtual?.grupoId; if(!gId)return;\n        await setDoc(doc(db,'configGrupos',gId),{grupoId:gId,regraAtraso:nova,regraAtrasoAtualizadaEm:new Date().toISOString()},{merge:true});\n        regraAtrasoAtual=nova; atualizarExplicacaoRegraAtrasoAdmin(); fecharConfiguracaoRegraAtraso(); alert('Regra de atraso atualizada. O aplicativo Cliente receberá a nova regra automaticamente.');\n    };\n    document.addEventListener('input',e=>{ if(['regraPct100','regraPct75','regraPct50','regraPct0'].includes(e.target?.id)) atualizarExplicacaoRegraAtrasoAdmin(); });\n\n'''
          assert auth_marker in s
          s=s.replace(auth_marker,auth_marker+js,1)

          # Load rule after both login paths before starting listeners.
          s=s.replace('''        await verificarEExecutarResetSemanal(adminLogadoAtual.codigoCliente || adminLogadoAtual.grupoId);\n        iniciarEscutasFirebase();''','''        await verificarEExecutarResetSemanal(adminLogadoAtual.codigoCliente || adminLogadoAtual.grupoId);\n        await carregarRegraAtraso();\n        iniciarEscutasFirebase();''')
          s=s.replace('''            await verificarEExecutarResetSemanal(adminLogadoAtual.codigoCliente || adminLogadoAtual.grupoId);\n            iniciarEscutasFirebase();''','''            await verificarEExecutarResetSemanal(adminLogadoAtual.codigoCliente || adminLogadoAtual.grupoId);\n            await carregarRegraAtraso();\n            iniciarEscutasFirebase();''')

          p.write_text(s)
          PY
          node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('index-ADMIN-v8.html','utf8');
          for(const m of s.matchAll(/<script(?: type="module")?>([\s\S]*?)<\/script>/g)){ try{ new Function(m[1].replace(/^\s*import .*$/mg,'')); }catch(e){ console.error(e.message); process.exit(1); } }
          NODE
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index-ADMIN-v8.html
          git commit -m "Add configurable delay scoring rule to ADM"
          git pull --rebase origin main
          git push
