name: Fix dashboard Firestore reference
on:
  push:
    paths:
      - .github/workflows/fix-dashboard-db.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard-ranking-pro.js')
          s=p.read_text()
          a="async function carregarDados(grupoId){\n  const [ps,hs]=await Promise.all([getDocs(query(collection(db,'perfis'),where('grupoId','==',grupoId))),getDocs(query(collection(db,'historico'),where('grupoId','==',grupoId)))]);"
          b="async function carregarDados(grupoId, db){\n  const [ps,hs]=await Promise.all([getDocs(query(collection(db,'perfis'),where('grupoId','==',grupoId))),getDocs(query(collection(db,'historico'),where('grupoId','==',grupoId)))]);"
          assert a in s
          s=s.replace(a,b,1)
          a2="const {perfis,historico}=await carregarDados(grupoId)"
          b2="const {perfis,historico}=await carregarDados(grupoId,db)"
          assert a2 in s
          s=s.replace(a2,b2,1)
          p.write_text(s)
          PY
      - name: Validate
        run: node --check dashboard-ranking-pro.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-ranking-pro.js
          git commit -m "Fix dashboard Firestore runtime reference"
          git pull --rebase origin main
          git push
